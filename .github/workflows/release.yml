name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Install dependencies
        run: pnpm install

      - name: Build Chrome zip
        run: pnpm zip

      - name: Build Firefox zip
        run: pnpm zip:firefox

      - name: Rename zips to fixed filenames
        run: |
          mv .output/*chrome.zip .output/ceir-extension-chrome.zip 2>/dev/null || true
          mv .output/*firefox.zip .output/ceir-extension-firefox.zip 2>/dev/null || true

      - name: Upload zips to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ github.event.release.tag_name }}"
          gh release upload "$tag" .output/ceir-extension-chrome.zip --clobber
          gh release upload "$tag" .output/ceir-extension-firefox.zip --clobber
